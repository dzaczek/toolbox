services:

  # ─────────────────────── Ubuntu 24.04 trio ───────────────────────
  u2404-a:
    build: { context: ., args: { UBUNTU_VERSION: "24.04" } }
    image: redis-ha-test:24.04
    container_name: redis-u2404-a
    hostname: redis-u2404-a
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../install-redis-ha.sh:/root/install-redis-ha.sh:ro
    environment:
      CONFIG_PASS_B64: "VGVzdFNpbG5lSGFzbG8yMDI2RG9ja2VyUmVkaXNIQQ=="
      CONFIG_IP_A: "10.10.4.11"
      CONFIG_IP_B: "10.10.4.12"
      CONFIG_IP_C: "10.10.4.13"
      CONFIG_CLUSTER_NAME: "testcluster2404"
      CONFIG_MAXMEMORY: "128mb"
    networks:
      net2404: { ipv4_address: 10.10.4.11 }

  u2404-b:
    image: redis-ha-test:24.04
    container_name: redis-u2404-b
    hostname: redis-u2404-b
